# Lets the pure-Python tests run without ROS:  python3 -m pytest   (from the repo root)
# The paths are relative to the repo root. Inside the container only colcon/ is mounted, so colcon test
# does not see this file; there the packages are installed and import by name.
[pytest]
pythonpath = colcon/ros2_ws/src/apollo_agv_follow colcon/ros2_ws/src/apollo_agv_sim colcon/ros2_ws/src/apollo_ring
testpaths =
    colcon/ros2_ws/src/apollo_agv_follow/test
    colcon/ros2_ws/src/apollo_agv_sim/test
    colcon/ros2_ws/src/apollo_agv_description/test
    colcon/ros2_ws/src/apollo_ring/test
    arduino/test
